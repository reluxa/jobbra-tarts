<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>sim-view — idővonal-megjelenítő (játszás nélküli napló)</title>
<style>
  :root { --bg:#0d1117; --fg:#d7dde5; --dim:#7d8896; --line:#232b36; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; padding:18px; }
  h1 { font-size:18px; margin:0 0 4px; font-weight:600; }
  h1 small { color:var(--dim); font-weight:400; }
  p.hint { color:var(--dim); margin:0 0 12px; font-size:13px; }
  #drop { border:1px dashed var(--line); padding:16px; text-align:center; color:var(--dim); border-radius:8px; margin-bottom:12px; cursor:pointer; }
  #drop.drag { border-color:#4fc3f7; color:#4fc3f7; }
  #metro { font-size:12px; color:var(--dim); margin-bottom:6px; }
  canvas { width:100%; background:#0b0f14; border:1px solid var(--line); border-radius:8px; display:block; }
  #events { margin-top:10px; max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; font-family:ui-monospace, monospace; }
  #events b { color:#ffd54a; }
  .ev { display:flex; gap:8px; border-bottom:1px solid #161c24; padding:1px 0; }
  .ev .t { color:var(--dim); min-width:64px; }
  .badge { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  input[type=range] { width:60%; }
  #scrub { display:flex; align-items:center; gap:8px; margin-top:8px; }
</style>
</head>
<body>
  <h1>sim-view <small>— idősík a játszás nélküli ellenőrzésből</small></h1>
  <p class="hint">Dobj ide egy <code>sim-run --json</code> fájlt, vagy használd az <code>?sim=</code> URL paramétert. Színkód: sávok (ábra felső), sebesség/kmh, kapu-óra, pontszám — események jelölve.</p>
  <div id="drop">⟵ JSON fájl ide húzva …</div>
  <div id="metro">nincs betöltött futás</div>
  <canvas id="cv" width="1600" height="560"></canvas>
  <div id="scrub">
    <span>⏩</span>
    <input type="range" id="scrubI" min="0" max="1000" value="1000" step="1">
    <span id="scrubT">–</span>
  </div>
  <div id="events"></div>

<script>
const $ = (id) => document.getElementById(id);
const COL = {
  lane: ['#ef5350', '#ffb74d', '#81c784'],   // sáv 0..2 (bal → jobb)
  overtake: '#7dffa0', penalty: '#ff8a80', gate: '#ffd54a',
  crash: '#ff5252', wrap: '#40c4ff', laneChange: '#90a4ae',
  laneBlocked: '#ce93d8', passed: '#9ad0ff', laneBad: '#ff3d00',
};
const LABEL = {
  overtake: '+30 ELŐZÉS', penalty: '-15 JOBBRÓL-ELŐZÉS', gate: 'KAPU',
  crash: 'BALESET', wrap: 'WRAP', laneChange: 'sávváltás', laneBlocked: 'SÁV FOGLALT',
  passed: 'megelőztek', timeout: 'KIFUTOTT', gameOver: 'VÉGE', start: 'INDULÁS',
};

let data = null, curT = Infinity, scrubbing = false;
const cv = $('cv'), ctx = cv.getContext('2d');

function fmt(t) { return t.toFixed(1).padStart(6, ' ') + ' s'; }

async function loadViaQuery() {
  const q = new URLSearchParams(location.search).get('sim');
  if (!q) return;
  try {
    const r = await fetch(q);
    if (r.ok) setData(await r.json(), q);
  } catch (e) { console.warn('?sim= hiba:', e); }
}

function setData(d, src) {
  data = d;
  const s = d.summary || {};
  $('metro').textContent =
    `futás: ${src || 'drag&drop'} · ${s.t ?? '–'}s · ${s.dist ?? 0}m · ${s.gates ?? 0} kapu · ` +
    `${s.score ?? 0} pont · ${s.crashes ?? 0} baleset · ${s.wraps ?? 0} wrap · befejezés: ${s.end ?? '–'}`;
  $('events').innerHTML = (d.events || []).map((e) => {
    const lbl = LABEL[e.kind] || e.kind;
    const col = e.kind === 'laneChange' ? (e.led ? COL.laneChange : '#ff8a80') : COL[e.kind];
    const extra = e.kind === 'laneChange' ? ` ${e.from}→${e.to}${e.led ? ' ✓' : ' ✗'}`
      : e.kind === 'gate' ? ' +' + e.bonus
      : e.kind === 'crash' ? ` élet=${e.lives}`
      : e.kind === 'wrap' ? ` δ=${e.delta}m · eltérés=${e.distInvariant.toFixed(4)}`
      : e.kind === 'penalty' ? (e.selfDidIt ? ' (saját)' : ' (más)') : '';
    return `<div class="ev"><span class="t">${e.t.toFixed(1)}s</span><span class="badge" style="background:${col}"></span><span>${lbl}${extra}</span></div>`;
  }).join('');
  draw();
}

function draw() {
  if (!data) return;
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const samples = data.samples || [], evs = data.events || [];
  const tEnd = Math.max(samples.length ? samples[samples.length - 1].t : 1, 1);
  const P = { l: 56, r: 24, t: 14, b: 20 };

  // ---- sáv-mező (befutás: lane az y-tengelyen) ----
  const laneTop = P.t, laneH = 92;
  ctx.fillStyle = '#0c1219';
  ctx.fillRect(P.l, laneTop, W - P.l - P.r, laneH);
  ctx.strokeStyle = '#1c2530';
  ctx.beginPath();
  for (const y of [0, 1, 2]) {
    const ly = laneTop + 20 + y * 22;
    ctx.moveTo(P.l, ly); ctx.lineTo(W - P.r, ly);
  }
  ctx.stroke();
  ctx.fillStyle = COL.lane[0]; ctx.fillText('bal', P.l + 6, laneTop + 34);
  ctx.fillStyle = COL.lane[1]; ctx.fillText('közép', P.l + 6, laneTop + 56);
  ctx.fillStyle = COL.lane[2]; ctx.fillText('jobbra', P.l + 6, laneTop + 78);
  // sáv-használat
  let prev = null;
  for (const smp of samples) {
    const x = P.l + (smp.t / tEnd) * (W - P.l - P.r);
    const y = laneTop + 20 + smp.lane * 22;
    if (prev) {
      ctx.strokeStyle = COL.lane[smp.lane];
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(x, y); ctx.stroke();
    }
    prev = { x, y };
  }
  ctx.lineWidth = 1;

  // ---- esemény jelölők (a sáv-mező alján) ----
  for (const e of evs) {
    if (!(e.kind in COL)) continue;
    const x = P.l + (e.t / tEnd) * (W - P.l - P.r);
    const yb = e.kind === 'crash' || e.kind === 'gate' ? laneTop : laneTop + laneH - 2;
    ctx.fillStyle = COL[e.kind];
    if (e.kind === 'wrap') { ctx.fillRect(x - 1, laneTop, 2, laneH); continue; }
    ctx.beginPath();
    ctx.arc(x, yb, e.kind === 'crash' ? 6 : 3.4, 0, Math.PI * 2);
    ctx.fill();
    if (e.kind === 'crash') { ctx.beginPath(); ctx.moveTo(x - 3.5, yb - 3.5); ctx.lineTo(x + 3.5, yb + 3.5); ctx.moveTo(x + 3.5, yb - 3.5); ctx.lineTo(x - 3.5, yb + 3.5); ctx.strokeStyle = '#ff5252'; ctx.stroke(); }
  }

  // ---- sebesség ----
  const spTop = laneTop + laneH + 60, spH = 100;
  axis(spTop, spH, 'km/h', [0, 200]);
  let prevK = null;
  for (const smp of samples) {
    const x = P.l + (smp.t / tEnd) * (W - P.l - P.r);
    const y = spTop + spH - (smp.kmh / 200) * spH;
    if (prevK) { ctx.strokeStyle = '#4fc3f7'; ctx.beginPath(); ctx.moveTo(prevK.x, prevK.y); ctx.lineTo(x, y); ctx.stroke(); }
    prevK = { x, y };
  }

  // ---- kapu-óra (energy/ gateT) ----
  const gTop = spTop + spH + 58, gH = 86;
  axis(gTop, gH, 'kapu-óra', [0, 100]);
  let prevE = null;
  for (const smp of samples) {
    const x = P.l + (smp.t / tEnd) * (W - P.l - P.r);
    const y = gTop + gH - (smp.energy * 100) * gH / 100;
    if (prevE) { ctx.strokeStyle = '#ffca28'; ctx.beginPath(); ctx.moveTo(prevE.x, prevE.y); ctx.lineTo(x, y); ctx.stroke(); }
    prevE = { x, y };
  }

  // ---- pontszám kumulatív ----
  const scTop = gTop + gH + 58, scH = 96;
  axis(scTop, scH, 'pontszám', null);
  const minS = Math.min(0, ...samples.map((s) => s.score));
  const maxS = Math.max(0, ...samples.map((s) => s.score));
  const span = Math.max(1, maxS - minS);
  let prevS = null;
  for (const smp of samples) {
    const x = P.l + (smp.t / tEnd) * (W - P.l - P.r);
    const y = scTop + scH - ((smp.score - minS) / span) * scH;
    if (prevS) { ctx.strokeStyle = '#cdd9e5'; ctx.beginPath(); ctx.moveTo(prevS.x, prevS.y); ctx.lineTo(x, y); ctx.stroke(); }
    prevS = { x, y };
  }
  ctx.fillStyle = '#7d8896';
  ctx.fillText('+ ' + Math.round(maxS), P.l - 34, scTop + 8);
  ctx.fillText(Math.round(minS), P.l - 30, scTop + scH - 2);

  // ---- kurzor ----
  if (curT !== Infinity) {
    const x = P.l + (curT / tEnd) * (W - P.l - P.r);
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(x, P.t); ctx.lineTo(x, scTop + scH); ctx.stroke();
    $('scrubT').textContent = fmt(curT);
  }
  $('scrubI').max = Math.round(tEnd * 10);
  timeTicks();
}

function axis(top, h, name, range) {
  ctx.strokeStyle = '#283240';
  ctx.beginPath(); ctx.moveTo(60, top); ctx.lineTo(cv.width - 24, top);
  ctx.moveTo(60, top + h); ctx.lineTo(cv.width - 24, top + h); ctx.stroke();
  ctx.fillStyle = '#5d6a7a';
  ctx.font = '11px ui-monospace, monospace';
  ctx.textAlign = 'right';
  if (range) {
    ctx.fillText(String(range[1]), 56, top + 8);
    ctx.fillText('0', 56, top + h - 2);
  }
  ctx.fillText(name, 56, top - 4);
  ctx.textAlign = 'left';
}

// ---- futamidő időtengely ----
const timeTicks = () => {
  if (!data || !data.samples.length) return;
  const tEnd = data.samples[data.samples.length - 1].t;
  ctx.fillStyle = '#7d8896';
  ctx.font = '11px ui-monospace, monospace';
  const step = Math.max(5, Math.round(tEnd / 16 / 10) * 10 || 10);
  for (let t = 0; t <= tEnd + 0.01; t += step) {
    const x = 56 + (t / tEnd) * (cv.width - 80);
    ctx.fillText(Math.round(t) + 's', x, cv.height - 4);
  }
};

// ---- interakció ----
cv.addEventListener('pointermove', (e) => {
  if (!data || !data.samples.length) return;
  const rect = cv.getBoundingClientRect();
  const fx = (e.clientX - rect.left) / rect.width;
  const tEnd = data.samples[data.samples.length - 1].t;
  curT = Math.max(0, Math.min(tEnd, fx * tEnd));
  draw();
});
cv.addEventListener('pointerleave', () => { if (!scrubbing) { curT = Infinity; draw(); } });
$('scrubI').addEventListener('input', (e) => {
  scrubbing = true;
  curT = Number(e.target.value) / 10;
  draw();
});
$('scrubI').addEventListener('change', () => { scrubbing = false; });

// ---- drag&drop ----
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('drag');
  const f = [...e.dataTransfer.files].find((x) => x.name.endsWith('.json'));
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { setData(JSON.parse(rd.result), f.name); } catch (err) { alert('nem JSON: ' + err); } };
  rd.readAsText(f);
});
drop.addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = () => { if (inp.files[0]) { const rd = new FileReader(); rd.onload = () => { try { setData(JSON.parse(rd.result), inp.files[0].name); } catch (err) { alert('nem JSON: ' + err); } }; rd.readAsText(inp.files[0]); } };
  inp.click();
});

loadViaQuery();
</script>
</body>
</html>
